packages:
  - "apps/*"
  - "packages/*"

# Pinned provider adapters were published within pnpm's default freshness window.
allowBuilds:
  "@google/genai": true
  bigint-buffer: true
  bufferutil: true
  utf-8-validate: true
  esbuild: true
  protobufjs: true
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - "@tanstack/ai-openai"
  - "@tanstack/ai-anthropic"
  - "@tanstack/ai-gemini"

# @solana/web3.js 1.91 resolves `rpc-websockets/dist/lib/client`, which 7.11 no longer ships.
overrides:
  rpc-websockets: 7.5.1
permissions:
  "@tanstack/ai":
    skills: true
  "@tanstack/react-router":
    skills: true
  "@tanstack/react-start":
    skills: true
  "@tanstack/router-plugin":
    skills: true
  keytar:
    build: true
  sharp:
    build: true
